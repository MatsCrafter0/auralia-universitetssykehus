<!doctype html><html lang="no"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administratorinnlogging – Auralia Universitetssykehus</title><style>body{font-family:system-ui;background:#101d2a;color:#e9f5fa;max-width:650px;margin:70px auto;padding:24px}a{color:#80e0da}button{background:#167e78;border:0;border-radius:9px;padding:13px 20px;color:white;font:inherit;cursor:pointer}button:disabled{opacity:.5}.card{background:#1b3040;padding:25px;border-radius:16px}p{line-height:1.6;color:#c0d2dc}code{overflow-wrap:anywhere}</style></head><body><p><a href="./">← Til sykehusnettsiden</a></p><div class="card"><h1>Google-innlogging</h1><p>Logg inn én gang med Google-kontoen som skal være administrator. Denne siden gir ingen redigeringstilgang.</p><button id="login">Logg inn med Google</button><button id="logout" hidden>Logg ut</button><p id="status" role="status"></p></div><script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js';
import {getAuth,GoogleAuthProvider,signInWithPopup,onAuthStateChanged,signOut} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js';
const app=initializeApp({apiKey:'AIzaSyADcE0v-334ntm09B-uw7YSE-mFCclxiSg',authDomain:'auralia-universitetssykehus.firebaseapp.com',projectId:'auralia-universitetssykehus',appId:'1:250206541604:web:933485d354eec7d3aa85b1'}),auth=getAuth(app);
const login=document.getElementById('login'),logout=document.getElementById('logout'),status=document.getElementById('status');
login.onclick=async()=>{try{await signInWithPopup(auth,new GoogleAuthProvider())}catch(e){status.textContent='Innlogging feilet: '+e.message}};
logout.onclick=()=>signOut(auth);
onAuthStateChanged(auth,user=>{login.hidden=!!user;logout.hidden=!user;status.textContent=user?'Du er logget inn. Gå nå til Firebase Console → Authentication → Users for å finne User UID.':'Du er ikke logget inn.'});
</script></body></html>
