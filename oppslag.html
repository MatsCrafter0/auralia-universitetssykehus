<!doctype html>
<html lang="no"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Oppslagstavle – Auralia Universitetssykehus</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#e7f0f5;background:#0c1824}*{box-sizing:border-box}body{margin:0}header{padding:22px max(20px,calc((100vw - 1000px)/2));border-bottom:1px solid #284252;background:#102433}main{max-width:1000px;margin:32px auto;padding:0 20px}a{color:#7fe5dc}h1{margin-bottom:6px}p{line-height:1.55;color:#b7c8d2}.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.cards{display:grid;gap:14px;margin-top:24px}.card,.panel{background:#172d3c;border:1px solid #345061;border-radius:14px;padding:20px}.card h2{margin:10px 0}.meta{font-size:.83rem;color:#9cb5c4}.pill{display:inline-block;border-radius:99px;padding:4px 10px;background:#294f60;color:#b4f5ee;font-size:.8rem}button{cursor:pointer;background:#137d77;color:white;border:0;border-radius:8px;padding:10px 15px;font:inherit}button.secondary{background:#344c5a}button.danger{background:#9d3745}button:disabled{opacity:.5;cursor:not-allowed}.actions{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}label{display:block;margin:12px 0 5px}input,textarea,select{width:100%;padding:10px;background:#0c202c;border:1px solid #557080;border-radius:7px;color:white;font:inherit}textarea{min-height:110px}#adminPanel{margin-top:25px}#message{min-height:24px}#adminStatus{font-size:.9rem}small{color:#b7c8d2}.hidden{display:none!important}
</style></head><body>
<header><a href="./index.html">← Auralia Universitetssykehus</a></header>
<main><div class="bar"><div><h1>Oppslagstavle</h1><p>Nyheter og kunngjøringer fra sykehusledelsen.</p></div><button id="login" class="secondary" hidden>Logg inn med Google</button><button id="logout" class="secondary" hidden>Logg ut</button></div>
<p id="message" role="status"></p><section id="adminPanel" class="panel hidden"><h2 id="formHeading">Nytt oppslag</h2><form id="postForm"><input type="hidden" id="editId"><label for="title">Tittel</label><input id="title" required maxlength="150"><label for="body">Innhold</label><textarea id="body" required maxlength="5000"></textarea><label for="category">Kategori</label><select id="category"><option>Informasjon</option><option>Viktig</option><option>Kurs</option><option>Møte</option></select><label><input type="checkbox" id="pinned" style="width:auto"> Fest øverst</label><label><input type="checkbox" id="published" style="width:auto" checked> Publisert</label><div class="actions"><button type="submit" id="save">Lagre oppslag</button><button type="button" id="cancel" class="secondary">Avbryt redigering</button></div></form><p id="adminStatus"></p></section>
<section id="posts" class="cards" aria-live="polite"></section></main>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js';
import {getAuth,GoogleAuthProvider,signInWithPopup,onAuthStateChanged,signOut} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js';
import {getFirestore,collection,query,where,onSnapshot,doc,addDoc,updateDoc,deleteDoc,serverTimestamp} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js';
import {firebaseConfig,adminUid} from './oppslag-config.js';
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','"':'&quot;',"'":'&#39;'}[c]));
const configured=firebaseConfig.apiKey&&firebaseConfig.projectId&&firebaseConfig.appId;
if(!configured){$('message').textContent='Oppslagstavlen er ikke konfigurert ennå. Administrator må fullføre Firebase-oppsettet.';throw Error('Firebase-konfigurasjon mangler');}
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app),posts=collection(db,'oppslag');
let canEdit=false,items=[],stopListening=null;
const reset=()=>{$('postForm').reset();$('editId').value='';$('formHeading').textContent='Nytt oppslag';$('published').checked=true};
const showPosts=()=>{$('posts').innerHTML=items.filter(x=>canEdit||x.published===true).sort((a,b)=>Number(b.pinned)-Number(a.pinned)||(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0)).map(x=>'<article class="card"><div class="bar"><span class="pill">'+esc(x.category)+'</span><span class="meta">'+(x.pinned?'📌 Festet · ':'')+esc(x.createdAt?.toDate?.().toLocaleDateString('no-NO')||'')+(canEdit&&!x.published?' · Utkast':'')+'</span></div><h2>'+esc(x.title)+'</h2><p style="white-space:pre-wrap">'+esc(x.body)+'</p>'+(canEdit?'<div class="actions"><button class="secondary" data-edit="'+esc(x.id)+'">Rediger</button><button class="danger" data-delete="'+esc(x.id)+'">Slett</button></div>':'')+'</article>').join('')||'<p>Ingen publiserte oppslag ennå.</p>'};
$('login').onclick=async()=>{try{await signInWithPopup(auth,new GoogleAuthProvider())}catch(e){$('message').textContent='Innlogging feilet: '+e.message}};
$('logout').onclick=()=>signOut(auth);
onAuthStateChanged(auth,user=>{canEdit=!!user&&user.uid===adminUid;$('login').hidden=!!user;$('logout').hidden=!user;$('adminPanel').classList.toggle('hidden',!canEdit);$('adminStatus').textContent=user&&!canEdit?'Du er innlogget, men denne Google-kontoen har ikke administratortilgang.':'';if(stopListening)stopListening();items=[];showPosts();stopListening=onSnapshot(canEdit?query(posts):query(posts,where('published','==',true)),snap=>{items=snap.docs.map(d=>({id:d.id,...d.data()}));showPosts();$('message').textContent=''},e=>{$('message').textContent='Kunne ikke hente oppslag: '+e.message});});
$('postForm').onsubmit=async e=>{e.preventDefault();if(!canEdit)return;const data={title:$('title').value.trim(),body:$('body').value.trim(),category:$('category').value,pinned:$('pinned').checked,published:$('published').checked};if(!data.title||!data.body)return;$('save').disabled=true;try{const id=$('editId').value;if(id)await updateDoc(doc(db,'oppslag',id),data);else await addDoc(posts,{...data,createdAt:serverTimestamp()});reset();$('adminStatus').textContent='Oppslaget er lagret.'}catch(err){$('adminStatus').textContent='Lagring feilet: '+err.message}finally{$('save').disabled=false}};
$('cancel').onclick=reset;
$('posts').onclick=async e=>{if(!canEdit)return;const edit=e.target.closest('[data-edit]'),del=e.target.closest('[data-delete]');if(edit){const x=items.find(x=>x.id===edit.dataset.edit);if(!x)return;$('editId').value=x.id;$('title').value=x.title;$('body').value=x.body;$('category').value=x.category;$('pinned').checked=!!x.pinned;$('published').checked=!!x.published;$('formHeading').textContent='Rediger oppslag';$('adminPanel').scrollIntoView({behavior:'smooth'})}if(del&&confirm('Slette dette oppslaget permanent?')){try{await deleteDoc(doc(db,'oppslag',del.dataset.delete))}catch(err){$('adminStatus').textContent='Sletting feilet: '+err.message}}};
</script></body></html>
